name: Verify AWS OIDC Authentication

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  verify-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: DEBUG - Decode GitHub OIDC Token Claims
        run: |
          TOKEN=$(curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          echo "====== OIDC JWT PAYLOAD ======"
          echo $TOKEN | cut -d'.' -f2 | python3 -c "
          import sys, base64, json
          d = sys.stdin.read().strip()
          d += '==' * (-len(d) % 4)
          print(json.dumps(json.loads(base64.b64decode(d)), indent=2))
          "
          echo "=============================="

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463470979621:role/GitHubActions-OIDC-Role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify Ephemeral AWS Credentials
        run: |
          echo "================================================="
          echo "SUCCESS - OIDC Authentication Successful!"
          echo "================================================="
          aws sts get-caller-identity
