name: Verify AWS OIDC Authentication

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# CRITICAL: Grant id-token permission to request the JWT token from GitHub OIDC
permissions:
  id-token: write
  contents: read

env:
  # Fix: Node 20 is deprecated on GitHub runners - allow it explicitly
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  verify-oidc:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463470979621:role/GitHubActions-OIDC-Role
          aws-region: us-east-1
          audience: sts.amazonaws.com

      - name: Verify Ephemeral AWS Credentials
        run: |
          echo "================================================="
          echo "✅ OIDC Authentication Successful!"
          echo "================================================="
          aws sts get-caller-identity
