name: Deploy Next.js & Verify AWS OIDC

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# CRITICAL: Grant id-token permission to request the JWT token from GitHub OIDC
permissions:
  id-token: write
  contents: read

jobs:
  build-and-authenticate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js Application
        run: npm run build

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::463470979621:role/GitHubActions-OIDC-Role
          aws-region: us-east-1  # Change to your preferred AWS Region (e.g. ap-south-1, us-east-1)

      - name: Verify Ephemeral AWS Credentials
        run: |
          echo "================================================="
          echo "🎉 OIDC Authentication Successful!"
          echo "================================================="
          aws sts get-caller-identity
